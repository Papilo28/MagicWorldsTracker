<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Login -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Admin Login</h1>
    <div id="loginMsg" class="hidden mb-4 p-3 rounded text-sm"></div>
    <input id="adminEmail"    type="email"    placeholder="Admin email"    class="w-full border rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-red-500">
    <input id="adminPassword" type="password" placeholder="Password"       class="w-full border rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-red-500">
    <button onclick="doLogin()" class="w-full bg-red-600 text-white py-2 rounded-lg font-semibold hover:bg-red-700 transition">Login</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="hidden">
  <nav class="bg-gray-900 text-white px-6 py-4 flex items-center justify-between">
    <h1 class="text-xl font-bold">Admin Panel</h1>
    <div class="flex gap-6 text-sm">
      <button onclick="showTab('stats')"       class="hover:text-yellow-300 transition tab-btn" data-tab="stats">Stats</button>
      <button onclick="showTab('affiliates')"  class="hover:text-yellow-300 transition tab-btn" data-tab="affiliates">Affiliates</button>
      <button onclick="showTab('conversions')" class="hover:text-yellow-300 transition tab-btn" data-tab="conversions">Conversions</button>
      <button onclick="downloadPayout()"       class="hover:text-yellow-300 transition">⬇ Payout Report</button>
      <button onclick="logout()"               class="text-red-400 hover:text-red-300">Logout</button>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto px-4 py-8">

    <!-- Stats Tab -->
    <div id="tabStats">
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white rounded-xl p-5 shadow-sm text-center"><p class="text-3xl font-bold text-blue-600" id="sAffiliates">—</p><p class="text-gray-500 text-sm mt-1">Active Affiliates</p></div>
        <div class="bg-white rounded-xl p-5 shadow-sm text-center"><p class="text-3xl font-bold text-indigo-600" id="sClicks">—</p><p class="text-gray-500 text-sm mt-1">Total Clicks</p></div>
        <div class="bg-white rounded-xl p-5 shadow-sm text-center"><p class="text-3xl font-bold text-green-600" id="sConversions">—</p><p class="text-gray-500 text-sm mt-1">Conversions</p></div>
        <div class="bg-white rounded-xl p-5 shadow-sm text-center"><p class="text-3xl font-bold text-yellow-600" id="sPayout">—</p><p class="text-gray-500 text-sm mt-1">Pending Payout</p></div>
      </div>
      <div class="bg-white rounded-xl p-6 shadow-sm">
        <h2 class="font-semibold text-gray-700 mb-4">Top Affiliates</h2>
        <div id="topAffiliates" class="text-sm text-gray-500">Loading...</div>
      </div>
    </div>

    <!-- Affiliates Tab -->
    <div id="tabAffiliates" class="hidden">
      <div class="flex gap-3 mb-4">
        <input id="affSearch" type="text" placeholder="Search name or email…"
          class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
          oninput="loadAffiliates()">
        <select id="affStatus" onchange="loadAffiliates()" class="border rounded-lg px-3 py-2">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="pending">Pending</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div id="affiliatesTable" class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <p class="p-4 text-gray-400 text-sm">Loading...</p>
      </div>
    </div>

    <!-- Conversions Tab -->
    <div id="tabConversions" class="hidden">
      <div class="mb-4">
        <select id="convStatus" onchange="loadConversions()" class="border rounded-lg px-3 py-2">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="paid">Paid</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div id="conversionsTable" class="bg-white rounded-xl shadow-sm overflow-x-auto">
        <p class="p-4 text-gray-400 text-sm">Loading...</p>
      </div>
    </div>

  </div>
</div>

<script>
  const API = '';
  function token() { return localStorage.getItem('admin_token'); }
  function authH() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() }; }
  function showMsg(id, msg, ok) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `mb-4 p-3 rounded text-sm ${ok?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}`;
    el.classList.remove('hidden');
  }

  async function doLogin() {
    const email    = document.getElementById('adminEmail').value.trim();
    const password = document.getElementById('adminPassword').value;
    const r = await fetch(API + '/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email,password}) });
    const d = await r.json();
    if (r.ok) { localStorage.setItem('admin_token', d.token); loadDashboard(); }
    else       showMsg('loginMsg', d.error || 'Login failed', false);
  }

  function logout() { localStorage.removeItem('admin_token'); location.reload(); }

  function showTab(tab) {
    ['stats','affiliates','conversions'].forEach(t => {
      document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('hidden', t !== tab);
    });
    if (tab === 'affiliates') loadAffiliates();
    if (tab === 'conversions') loadConversions();
  }

  async function loadDashboard() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    const r = await fetch(API + '/api/admin/stats', { headers: authH() });
    if (!r.ok) { logout(); return; }
    const d = await r.json();
    document.getElementById('sAffiliates').textContent = d.affiliates?.active || 0;
    document.getElementById('sClicks').textContent     = d.clicks?.total || 0;
    document.getElementById('sConversions').textContent= d.conversions?.total || 0;
    document.getElementById('sPayout').textContent     = '$' + parseFloat(d.earnings?.pending_payout || 0).toFixed(2);

    const top = document.getElementById('topAffiliates');
    if (!d.top_affiliates?.length) { top.textContent = 'No affiliates yet.'; return; }
    top.innerHTML = `<table class="w-full text-left"><thead class="bg-gray-50"><tr>
      <th class="px-4 py-2">Code</th><th class="px-4 py-2">Name</th>
      <th class="px-4 py-2">Clicks</th><th class="px-4 py-2">Conversions</th><th class="px-4 py-2">Earnings</th>
    </tr></thead><tbody>${d.top_affiliates.map(a=>`<tr class="border-t">
      <td class="px-4 py-2 font-mono text-xs">${a.affiliate_code}</td>
      <td class="px-4 py-2">${a.name}</td>
      <td class="px-4 py-2">${a.clicks}</td>
      <td class="px-4 py-2">${a.conversions}</td>
      <td class="px-4 py-2 font-semibold text-green-600">$${parseFloat(a.earnings).toFixed(2)}</td>
    </tr>`).join('')}</tbody></table>`;
  }

  async function loadAffiliates() {
    const search = document.getElementById('affSearch').value;
    const status = document.getElementById('affStatus').value;
    const qs = new URLSearchParams({ limit:50, ...(search&&{search}), ...(status&&{status}) });
    const r  = await fetch(API + '/api/admin/affiliates?' + qs, { headers: authH() });
    const d  = await r.json();
    const el = document.getElementById('affiliatesTable');
    if (!d.affiliates?.length) { el.innerHTML = '<p class="p-4 text-gray-400">No affiliates found.</p>'; return; }
    el.innerHTML = `<table class="w-full text-left text-sm"><thead class="bg-gray-50"><tr>
      <th class="px-4 py-2">Code</th><th class="px-4 py-2">Name</th><th class="px-4 py-2">Email</th>
      <th class="px-4 py-2">Status</th><th class="px-4 py-2">Clicks</th><th class="px-4 py-2">Earnings</th><th class="px-4 py-2">Actions</th>
    </tr></thead><tbody>${d.affiliates.map(a=>`<tr class="border-t">
      <td class="px-4 py-2 font-mono text-xs">${a.affiliate_code}</td>
      <td class="px-4 py-2">${a.name}</td>
      <td class="px-4 py-2 text-gray-500">${a.email}</td>
      <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs ${a.status==='active'?'bg-green-100 text-green-700':a.status==='pending'?'bg-yellow-100 text-yellow-700':'bg-gray-100 text-gray-600'}">${a.status}</span></td>
      <td class="px-4 py-2">${a.clicks}</td>
      <td class="px-4 py-2 font-semibold text-green-600">$${parseFloat(a.total_earnings||0).toFixed(2)}</td>
      <td class="px-4 py-2">
        ${a.status!=='active'?`<button onclick="setAffStatus(${a.id},'active')"   class="text-green-600 hover:underline mr-2 text-xs">Activate</button>`:''}
        ${a.status!=='inactive'?`<button onclick="setAffStatus(${a.id},'inactive')" class="text-red-500 hover:underline text-xs">Deactivate</button>`:''}
      </td>
    </tr>`).join('')}</tbody></table>`;
  }

  async function setAffStatus(id, status) {
    await fetch(API + '/api/admin/affiliates/' + id, { method:'PUT', headers: authH(), body: JSON.stringify({status}) });
    loadAffiliates();
  }

  async function loadConversions() {
    const status = document.getElementById('convStatus').value;
    const qs = new URLSearchParams({ limit:50, ...(status&&{status}) });
    const r  = await fetch(API + '/api/admin/conversions?' + qs, { headers: authH() });
    const d  = await r.json();
    const el = document.getElementById('conversionsTable');
    if (!d.conversions?.length) { el.innerHTML = '<p class="p-4 text-gray-400">No conversions found.</p>'; return; }
    el.innerHTML = `<table class="w-full text-left text-sm"><thead class="bg-gray-50"><tr>
      <th class="px-4 py-2">Date</th><th class="px-4 py-2">Affiliate</th><th class="px-4 py-2">Type</th>
      <th class="px-4 py-2">Value</th><th class="px-4 py-2">Commission</th><th class="px-4 py-2">Status</th><th class="px-4 py-2">Action</th>
    </tr></thead><tbody>${d.conversions.map(c=>`<tr class="border-t">
      <td class="px-4 py-2 text-gray-400 text-xs">${new Date(c.created_at).toLocaleDateString()}</td>
      <td class="px-4 py-2">${c.affiliate_name}</td>
      <td class="px-4 py-2">${c.conversion_type}</td>
      <td class="px-4 py-2">${c.conversion_value} ${c.currency}</td>
      <td class="px-4 py-2 font-semibold text-green-600">$${parseFloat(c.commission_amount).toFixed(4)}</td>
      <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs ${c.status==='paid'?'bg-green-100 text-green-700':c.status==='approved'?'bg-blue-100 text-blue-700':c.status==='rejected'?'bg-red-100 text-red-700':'bg-yellow-100 text-yellow-700'}">${c.status}</span></td>
      <td class="px-4 py-2 flex gap-1">
        ${c.status==='pending'?`<button onclick="setConvStatus(${c.id},'approved')" class="text-blue-600 hover:underline text-xs">Approve</button>`:''}
        ${c.status==='approved'?`<button onclick="setConvStatus(${c.id},'paid')" class="text-green-600 hover:underline text-xs">Mark Paid</button>`:''}
        ${c.status==='pending'?`<button onclick="setConvStatus(${c.id},'rejected')" class="text-red-500 hover:underline text-xs ml-1">Reject</button>`:''}
      </td>
    </tr>`).join('')}</tbody></table>`;
  }

  async function setConvStatus(id, status) {
    await fetch(API + '/api/admin/conversions?id=' + id, { method:'PUT', headers: authH(), body: JSON.stringify({status}) });
    loadConversions();
  }

  function downloadPayout() {
    window.location = API + '/api/admin/payout?token=' + token();
  }

  if (token()) loadDashboard();
</script>
</body>
</html>
