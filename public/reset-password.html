<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Reset Password - Magic Worlds Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050510;--a:#7c6dfa;--b:#00d4ff;--ga:linear-gradient(135deg,#7c6dfa,#00d4ff);--s1:rgba(255,255,255,.04);--bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.13);--txt:#eeeeff;--txt2:#8888aa;--txt3:#4a4a6a;--r:.75rem}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 0%,rgba(124,109,250,.12),transparent 70%),radial-gradient(ellipse 50% 50% at 80% 80%,rgba(0,212,255,.08),transparent 60%);pointer-events:none}
h1,h2,h3,h4{font-family:'Poppins',sans-serif}
.box{background:linear-gradient(135deg,rgba(13,13,38,.95),rgba(8,8,25,.95));border:1px solid var(--bdr2);border-radius:1.4rem;padding:2.5rem;width:100%;max-width:440px;position:relative;z-index:1;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.logo{display:flex;align-items:center;gap:.65rem;justify-content:center;margin-bottom:2rem}
.logo-mark{width:36px;height:36px;border-radius:9px;background:var(--ga);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:.78rem;color:#fff}
.logo-text{font-family:'Poppins',sans-serif;font-weight:700;font-size:.95rem}
.logo-text .acc{background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
h2{font-size:1.5rem;text-align:center;margin-bottom:.4rem}
.sub{text-align:center;color:var(--txt2);font-size:.88rem;margin-bottom:1.75rem;line-height:1.6}
.form-group{margin-bottom:.9rem}
label{display:block;font-size:.8rem;font-weight:500;color:var(--txt2);margin-bottom:.4rem;font-family:'Poppins',sans-serif}
input{width:100%;padding:.8rem 1rem;background:rgba(255,255,255,.04);border:1px solid var(--bdr2);border-radius:var(--r);color:var(--txt);font-size:.875rem;font-family:'DM Sans',sans-serif;transition:border-color .2s}
input:focus{outline:none;border-color:rgba(124,109,250,.5)}
input::placeholder{color:var(--txt3)}
.btn{width:100%;padding:.85rem;border-radius:var(--r);font-family:'Poppins',sans-serif;font-weight:600;font-size:.9rem;background:var(--ga);color:#fff;border:none;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;margin-top:.4rem}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 32px rgba(124,109,250,.25)}
.btn:disabled{opacity:.6;transform:none;cursor:not-allowed}
.msg{padding:.65rem 1rem;border-radius:var(--r);font-size:.82rem;margin-top:.75rem;text-align:center;display:none}
.msg.ok{background:rgba(0,255,163,.08);border:1px solid rgba(0,255,163,.18);color:#00ffa3}
.msg.err{background:rgba(255,100,100,.08);border:1px solid rgba(255,100,100,.18);color:#ff7070}
.back-link{text-align:center;margin-top:1.1rem;font-size:.82rem;color:var(--txt3)}
.back-link a{color:var(--a);text-decoration:none}
.back-link a:hover{text-decoration:underline}
.req-form{display:block}.new-form{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo">
    <div class="logo-mark">MW</div>
    <div class="logo-text">MAGIC<span class="acc">WORLDS</span> TRACKER</div>
  </div>

  <div class="req-form" id="req-form">
    <h2>Reset Password</h2>
    <p class="sub">Enter your email and we will send you a magic link to access your account.</p>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="req-email" placeholder="you@email.com" onkeydown="if(event.key==='Enter')requestReset()">
    </div>
    <button class="btn" id="req-btn" onclick="requestReset()">Send Magic Link</button>
    <div class="msg" id="req-msg"></div>
    <div class="back-link"><a href="/">Back to home</a></div>
  </div>

  <div class="new-form" id="new-form">
    <h2>Set New Password</h2>
    <p class="sub">Enter your new password below.</p>
    <div class="form-group">
      <label>New Password</label>
      <input type="password" id="new-pw" placeholder="Minimum 8 characters">
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirm-pw" placeholder="Repeat your password">
    </div>
    <button class="btn" id="new-btn" onclick="submitNewPassword()">Set New Password</button>
    <div class="msg" id="new-msg"></div>
  </div>
</div>
<script>
const API='https://api.magictracker.cc';
function showMsg(id,type,text){const el=document.getElementById(id);el.textContent=text;el.className='msg '+(type==='ok'?'ok':'err');el.style.display='block'}

// Check if reset token in URL
const params=new URLSearchParams(window.location.search);
const token=params.get('token');
const type=params.get('type');
if(token){
  document.getElementById('req-form').style.display='none';
  document.getElementById('new-form').style.display='block';
}

async function requestReset(){
  const email=document.getElementById('req-email').value.trim();
  if(!email){showMsg('req-msg','err','Please enter your email address');return}
  const btn=document.getElementById('req-btn');
  btn.disabled=true;btn.textContent='Sending...';
  // Try all user types
  const endpoints=['/api/affiliates/forgot-password','/api/merchants/forgot-password','/api/superadmin/forgot-password'];
  let sent=false;
  for(const ep of endpoints){
    try{
      const r=await fetch(API+ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
      if(r.ok){sent=true;break}
    }catch{}
  }
  btn.disabled=false;btn.textContent='Send Magic Link';
  showMsg('req-msg','ok','If an account with that email exists, a magic link has been sent. Check your inbox.');
}

async function submitNewPassword(){
  const pw=document.getElementById('new-pw').value;
  const cpw=document.getElementById('confirm-pw').value;
  if(!pw||pw.length<8){showMsg('new-msg','err','Password must be at least 8 characters');return}
  if(pw!==cpw){showMsg('new-msg','err','Passwords do not match');return}
  const btn=document.getElementById('new-btn');
  btn.disabled=true;btn.textContent='Saving...';
  try{
    const r=await fetch(API+'/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:pw,type:type||'affiliate'})});
    const d=await r.json();
    if(r.ok){
      showMsg('new-msg','ok','Password updated. Redirecting to login...');
      setTimeout(()=>window.location.href='/',2000);
    }else showMsg('new-msg','err',d.error||'Failed to reset password');
  }catch(e){showMsg('new-msg','err','Error: '+e.message)}
  btn.disabled=false;btn.textContent='Set New Password';
}
</script>
</body>
</html>
