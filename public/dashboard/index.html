<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Login Screen -->
<div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Affiliate Portal</h1>
    <p class="text-gray-500 text-center mb-6">Enter your email to receive a magic login link</p>
    <div id="loginMsg" class="hidden mb-4 p-3 rounded text-sm"></div>
    <input id="loginEmail" type="email" placeholder="you@example.com"
      class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button onclick="requestLogin()"
      class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
      Send Magic Link
    </button>
    <p class="text-center text-sm text-gray-400 mt-4">Don't have an account?
      <a href="#" onclick="showSignup()" class="text-blue-600 hover:underline">Sign up</a>
    </p>
  </div>
</div>

<!-- Sign Up Screen -->
<div id="signupScreen" class="hidden min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Affiliate Account</h1>
    <div id="signupMsg" class="hidden mb-4 p-3 rounded text-sm"></div>
    <input id="signupName"  type="text"  placeholder="Your name"    class="w-full border rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <input id="signupEmail" type="email" placeholder="Email address" class="w-full border rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <input id="signupSite"  type="url"   placeholder="Website (optional)" class="w-full border rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <input id="signupWallet" type="text" placeholder="Wallet address (optional)" class="w-full border rounded-lg px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
    <button onclick="doSignup()"
      class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">
      Create Account
    </button>
    <p class="text-center text-sm text-gray-400 mt-4">Already have an account?
      <a href="#" onclick="showLogin()" class="text-blue-600 hover:underline">Log in</a>
    </p>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard" class="hidden">
  <nav class="bg-white shadow-sm px-6 py-4 flex items-center justify-between">
    <h1 class="text-xl font-bold text-gray-800">Affiliate Dashboard</h1>
    <button onclick="logout()" class="text-sm text-red-500 hover:underline">Logout</button>
  </nav>

  <div class="max-w-5xl mx-auto px-4 py-8">
    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl p-5 shadow-sm text-center">
        <p class="text-3xl font-bold text-blue-600" id="statClicks">—</p>
        <p class="text-gray-500 text-sm mt-1">Total Clicks</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm text-center">
        <p class="text-3xl font-bold text-green-600" id="statConversions">—</p>
        <p class="text-gray-500 text-sm mt-1">Conversions</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm text-center">
        <p class="text-3xl font-bold text-purple-600" id="statEarned">—</p>
        <p class="text-gray-500 text-sm mt-1">Total Earned</p>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm text-center">
        <p class="text-3xl font-bold text-yellow-600" id="statPending">—</p>
        <p class="text-gray-500 text-sm mt-1">Pending Payout</p>
      </div>
    </div>

    <!-- Tracking Link -->
    <div class="bg-white rounded-xl p-6 shadow-sm mb-6">
      <h2 class="font-semibold text-gray-700 mb-3">Your Tracking Link</h2>
      <div class="flex gap-2">
        <input id="trackingLink" readonly class="flex-1 bg-gray-100 rounded-lg px-4 py-2 text-sm font-mono text-gray-700">
        <button onclick="copyLink()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700">Copy</button>
      </div>
    </div>

    <!-- Recent Conversions -->
    <div class="bg-white rounded-xl p-6 shadow-sm">
      <h2 class="font-semibold text-gray-700 mb-4">Recent Conversions</h2>
      <div id="conversionsList" class="text-sm text-gray-500">Loading...</div>
    </div>
  </div>
</div>

<script>
  const API = '';

  function token() { return localStorage.getItem('aff_token'); }
  function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token() }; }

  function showMsg(id, msg, ok) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.className = `mb-4 p-3 rounded text-sm ${ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
    el.classList.remove('hidden');
  }

  function showLogin()  { document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('signupScreen').classList.add('hidden'); }
  function showSignup() { document.getElementById('signupScreen').classList.remove('hidden'); document.getElementById('loginScreen').classList.add('hidden'); }

  async function requestLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    if (!email) return showMsg('loginMsg', 'Please enter your email', false);
    const r = await fetch(API + '/api/affiliates/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    const d = await r.json();
    if (d.dev_magic_url) {
      showMsg('loginMsg', '✅ Magic link ready (dev mode — click to log in)', true);
      const a = document.createElement('a'); a.href = d.dev_magic_url;
      a.textContent = ' [Login now]'; a.className = 'font-semibold underline';
      document.getElementById('loginMsg').appendChild(a);
    } else {
      showMsg('loginMsg', d.message || 'Check your email for a magic link', true);
    }
  }

  async function doSignup() {
    const body = {
      name: document.getElementById('signupName').value.trim(),
      email: document.getElementById('signupEmail').value.trim(),
      website: document.getElementById('signupSite').value.trim(),
      wallet_address: document.getElementById('signupWallet').value.trim()
    };
    if (!body.name || !body.email) return showMsg('signupMsg', 'Name and email are required', false);
    const r = await fetch(API + '/api/affiliates/signup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if (r.ok) { showMsg('signupMsg', '✅ Account created! Check your email to log in.', true); }
    else       { showMsg('signupMsg', d.error || 'Signup failed', false); }
  }

  async function loadDashboard() {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('signupScreen').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');

    const [meRes, statsRes, convRes] = await Promise.all([
      fetch(API + '/api/affiliates/me',          { headers: authHeaders() }),
      fetch(API + '/api/affiliates/stats',        { headers: authHeaders() }),
      fetch(API + '/api/affiliates/conversions',  { headers: authHeaders() })
    ]);

    if (!meRes.ok) { logout(); return; }

    const me    = await meRes.json();
    const stats = await statsRes.json();
    const convs = await convRes.json();

    document.getElementById('trackingLink').value = me.tracking_link || '';
    document.getElementById('statClicks').textContent      = stats.clicks || 0;
    document.getElementById('statConversions').textContent = stats.conversions || 0;
    document.getElementById('statEarned').textContent      = '$' + parseFloat(stats.earnings?.total || 0).toFixed(2);
    document.getElementById('statPending').textContent     = '$' + parseFloat(stats.earnings?.approved || 0).toFixed(2);

    const list = document.getElementById('conversionsList');
    if (!convs.conversions?.length) { list.textContent = 'No conversions yet.'; return; }
    list.innerHTML = convs.conversions.map(c => `
      <div class="flex justify-between items-center py-2 border-b last:border-0">
        <div>
          <span class="font-medium text-gray-700">${c.conversion_type}</span>
          <span class="ml-2 text-gray-400 text-xs">${new Date(c.created_at).toLocaleDateString()}</span>
        </div>
        <div class="text-right">
          <span class="text-green-600 font-semibold">$${parseFloat(c.commission_amount).toFixed(4)}</span>
          <span class="ml-2 px-2 py-0.5 rounded-full text-xs ${c.status==='paid'?'bg-green-100 text-green-700':c.status==='approved'?'bg-blue-100 text-blue-700':'bg-yellow-100 text-yellow-700'}">${c.status}</span>
        </div>
      </div>`).join('');
  }

  function copyLink() {
    const el = document.getElementById('trackingLink');
    navigator.clipboard.writeText(el.value).then(() => alert('Copied!'));
  }

  function logout() {
    localStorage.removeItem('aff_token');
    location.reload();
  }

  // Handle magic link token in URL
  const params = new URLSearchParams(location.search);
  if (params.get('token') && params.get('email')) {
    fetch(API + '/api/affiliates/magic?token=' + params.get('token') + '&email=' + params.get('email'))
      .then(r => r.json()).then(d => {
        if (d.token) { localStorage.setItem('aff_token', d.token); history.replaceState({}, '', '/dashboard'); loadDashboard(); }
        else { showMsg('loginMsg', d.error || 'Login link invalid or expired', false); }
      });
  } else if (token()) {
    loadDashboard();
  }
</script>
</body>
</html>
